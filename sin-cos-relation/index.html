<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사인과 코사인의 관계</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    [hidden] { display: none !important; }
    .page-body { display: flex; flex-direction: row; flex: 1; min-height: 0; }
    .canvas-wrap { position: relative; flex: 1; min-width: 0; background: var(--panel-bg); }
    .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

    .ctrl-bar {
      width: 360px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    #barCand { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ctrl-label { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-right: 2px; }
    .rd-btn {
      padding: 8px 18px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rd-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .rd-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rd-btn.primary:hover { background: var(--accent-dark); color: #fff; }

    .seg-bar { display: inline-flex; }
    .seg-btn {
      padding: 8px 22px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .seg-btn:first-child { border-radius: 8px 0 0 8px; }
    .seg-btn:last-child { border-radius: 0 8px 8px 0; }
    .seg-btn:not(:first-child) { border-left: none; }
    .seg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .seg-btn[data-fn="sin"].active { background: #e17055; border-color: #e17055; }
    .seg-btn[data-fn="cos"].active { background: #0984e3; border-color: #0984e3; }
    .cand-btn {
      padding: 8px 18px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cand-btn[data-fn="sin"]:hover, .cand-btn[data-fn="sin"].active { border-color: #e8590c; background: #fff0e6; color: #c2410c; }
    .cand-btn[data-fn="cos"]:hover, .cand-btn[data-fn="cos"].active { border-color: #1971c2; background: #e7f1fb; color: #1558a0; }
    .cand-btn.right { border-color: #099268 !important; background: #e6f7f1 !important; color: #00836a !important; }
    .cand-btn.wrong { border-color: #c92a2a !important; background: #fff0f0 !important; color: #c92a2a !important; }
    .rd-cell.bad .rd-val { color: #c92a2a; }
    .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

    .readouts { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .rd-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 0;
    }
    .rd-name { font-size: 0.95rem; color: var(--text-muted); font-weight: 700; }
    .rd-val { font-size: 1.45rem; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
    .rd-cell.target-cell { background: #eef1f8; border-color: #1b2a4e; }
    .rd-cell.target-cell .rd-val { color: #1b2a4e; }
    .divider { border: none; border-top: 2px dashed var(--border); margin: 2px 0; }
    .rd-cell.hl { background: var(--accent-light); border-color: var(--accent); }
    .rd-cell.hl .rd-val { color: var(--accent-dark); }
    .rd-cell.ok { background: #e6f7f1; border-color: #00a383; }
    .rd-cell.ok .rd-val { color: #00836a; }
    .rd-cell.ok { animation: pop 0.6s ease-out, glow 1.2s ease-in-out 3; }
    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 rgba(9,146,104,0); }
      50% { box-shadow: 0 0 18px 4px rgba(9,146,104,0.55); }
    }

    @media (max-width: 760px) {
      body { overflow: auto; height: auto; min-height: 100dvh; }
      .page-body { flex-direction: column; }
      .canvas-wrap { flex: none; height: 320px; }
      .ctrl-bar { width: auto; border-left: none; border-top: 1px solid var(--border); overflow-y: visible; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <a href="../index.html" class="back-link">← 목록</a>
    <span class="page-title">사인과 코사인의 관계</span>
  </header>

  <main class="page-body">
    <div class="canvas-wrap"><canvas id="mainCanvas"></canvas></div>

    <div class="ctrl-bar">
      <div class="ctrl-row">
        <button class="rd-btn" id="btnReset">처음으로</button>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">함수</span>
        <span class="seg-bar" id="barFn">
          <button class="seg-btn active" data-fn="sin">sin</button>
          <button class="seg-btn" data-fn="cos">cos</button>
        </span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">상수</span>
        <span class="seg-bar" id="barC">
          <button class="seg-btn" data-c="1">π/2</button>
          <button class="seg-btn active" data-c="2">π</button>
          <button class="seg-btn" data-c="3">3π/2</button>
          <button class="seg-btn" data-c="4">2π</button>
        </span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">부호</span>
        <span class="seg-bar" id="barS">
          <button class="seg-btn active" data-s="1">+</button>
          <button class="seg-btn" data-s="-1">−</button>
        </span>
      </div>
      <div class="rd-cell target-cell"><div class="rd-name">남색 그래프</div><div class="rd-val" id="rdTarget"></div></div>

      <hr class="divider">

      <div class="ctrl-row">
        <span class="ctrl-label">남색 그래프는 어떤 식과 같을까요?</span>
        <span id="barCand">
          <button class="cand-btn" data-fn="sin" data-sg="1">sin x</button>
          <button class="cand-btn" data-fn="sin" data-sg="-1">−sin x</button>
          <button class="cand-btn" data-fn="cos" data-sg="1">cos x</button>
          <button class="cand-btn" data-fn="cos" data-sg="-1">−cos x</button>
        </span>
      </div>

      <div class="readouts">
        <div class="rd-cell" id="cellResult"><div class="rd-name" id="rdResName">결과</div><div class="rd-val" id="rdResult">—</div></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
