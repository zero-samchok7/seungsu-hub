<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>호도법</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    .page-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .stage {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .stage-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
    }
    .stage-panel + .stage-panel { border-left: 1px solid var(--border); flex: 1.25; }
    .panel-label {
      padding: 10px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-label b { color: var(--accent); }
    .canvas-wrap { position: relative; flex: 1; min-height: 0; }
    .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #circleCanvas { cursor: crosshair; }

    .ctrl-bar {
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ctrl-label { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-right: 2px; }
    .rd-btn {
      padding: 8px 18px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rd-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .rd-btn.toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rd-btn.toggle.neg.on { background: #0984e3; border-color: #0984e3; }
    .rd-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rd-btn.primary:hover { background: var(--accent-dark); color: #fff; }
    .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

    .readouts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .rd-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 0;
    }
    .rd-name { font-size: 0.95rem; color: var(--text-muted); font-weight: 700; }
    .rd-val { font-size: 1.45rem; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rd-cell.hl { background: var(--accent-light); border-color: var(--accent); }
    .rd-cell.hl .rd-val { color: var(--accent-dark); }

    @media (max-width: 760px) {
      body { font-size: 17px; overflow: auto; height: auto; min-height: 100dvh; }
      .stage { flex-direction: column; }
      .stage-panel, .stage-panel + .stage-panel { flex: none; height: 360px; border-left: none; border-top: 1px solid var(--border); }
      .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <a href="../index.html" class="back-link">← 허브</a>
    <span class="page-title">호도법 — 각을 실수에 대응시키기</span>
  </header>

  <main class="page-body">
    <div class="stage">
      <section class="stage-panel">
        <div class="panel-label">단위원과 바깥 원 · 점을 <b>드래그</b>하거나 원을 <b>클릭</b>해 각을 만드세요 (바깥 원의 ● 를 끌면 반지름이 바뀝니다)</div>
        <div class="canvas-wrap"><canvas id="circleCanvas"></canvas></div>
      </section>
      <section class="stage-panel">
        <div class="panel-label">호를 펴면 <b>수직선 위의 실수</b>가 됩니다 · 손을 떼면 호가 펴져요</div>
        <div class="canvas-wrap"><canvas id="lineCanvas"></canvas></div>
      </section>
    </div>

    <div class="ctrl-bar">
      <div class="ctrl-row">
        <span class="ctrl-label">정확한 각으로 이동</span>
        <button class="rd-btn" data-deg="90">90°</button>
        <button class="rd-btn" data-deg="180">180°</button>
        <button class="rd-btn" data-deg="270">270°</button>
        <button class="rd-btn" data-deg="360">360°</button>
        <button class="rd-btn" id="btnReset">처음으로</button>
        <span class="sep"></span>
        <button class="rd-btn toggle" id="togTurns">한 바퀴 넘기기</button>
        <button class="rd-btn toggle neg" id="togNeg">음의 방향 (시계 방향)</button>
        <span class="sep"></span>
        <button class="rd-btn primary" id="btnDivide">÷ 반지름 해보기</button>
      </div>
      <div class="readouts">
        <div class="rd-cell"><div class="rd-name">각도 (육십분법)</div><div class="rd-val" id="rdDeg">0°</div></div>
        <div class="rd-cell"><div class="rd-name">안쪽 원(r = 1)의 호의 길이 ℓ₁</div><div class="rd-val" id="rdL1">0</div></div>
        <div class="rd-cell"><div class="rd-name" id="rdL2Name">바깥 원(r = 2.0)의 호의 길이 ℓ₂</div><div class="rd-val" id="rdL2">0</div></div>
        <div class="rd-cell"><div class="rd-name">ℓ ÷ r (호의 길이 ÷ 반지름)</div><div class="rd-val" id="rdRatio">–</div></div>
        <div class="rd-cell hl"><div class="rd-name">각에 대응하는 하나의 실수 θ</div><div class="rd-val" id="rdTheta">0</div></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
